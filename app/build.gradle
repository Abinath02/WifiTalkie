plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.wifitalkie'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.wifitalkie"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}


dependencies {
  
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // நிலையான பதிப்பிற்கு மாற்றப்பட்டது


    implementation 'com.squareup.retrofit2:retrofit:2.9.0' // மிகவும் நிலையான மற்றும் பரவலாகப் பயன்படுத்தப்படும் பதிப்பு
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0' // retrofit உடன் பதிப்பு பொருந்த வேண்டும்


    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0' // மிக முக்கியமான மாற்றம்: glide உடன் பதிப்பு பொருந்த வேண்டும்


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5' // பொதுவான நிலையான பதிப்பிற்குப் புதுப்பிக்கப்பட்டது
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1' // பொதுவான நிலையான பதிப்பிற்குப் புதுப்பிக்கப்பட்டது
}

